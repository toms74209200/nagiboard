name: Job - OpenAPI Bundle

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: 'Directory of the OpenAPI project'

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Bundle
        run: npm run bundle
      - id: check-bundle
        name: Check bundle changed
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check-bundle.outputs.changed == 'true'
        name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m ":package: Update bundle"
          git push
