name: On Pull Request (Mast)

on:
  pull_request:
    branches:
      - master
    paths:
      - 'mast/**'

jobs:
  generate:
    uses: ./.github/workflows/job-openapi-generate.yml
    with:
      working-directory: spec
      output-path: mast/openapi/
  lint:
    needs:
      - generate
    uses: ./.github/workflows/job-rs-lint.yml
    with:
      working-directory: mast
      restore-cache-key: ${{ needs.generate.outputs.cache-key }}
      restore-cache-path: mast/openapi/
  test-small:
    needs:
      - generate
    uses: ./.github/workflows/job-rs-test-small.yml
    with:
      working-directory: mast
      with-coverage: true
      restore-cache-key: ${{ needs.generate.outputs.cache-key }}
      restore-cache-path: mast/openapi/
  coverage:
    needs:
      - test-small
    uses: ./.github/workflows/job-rs-coverage.yml
    with:
      working-directory: mast
      coverage-threshold: 80
  test-medium:
    needs:
      - generate
    uses: ./.github/workflows/job-rs-test-medium.yml
    with:
      working-directory: mast
      restore-cache-key: ${{ needs.generate.outputs.cache-key }}
      restore-cache-path: mast/openapi/
