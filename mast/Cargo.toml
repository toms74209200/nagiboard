[package]
name = "mast"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
keel = { version = "0.1.0", path = "../keel" }
openapi = { version = "0.1.0", path = "openapi" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
uuid = "1"

[features]
medium = []

[dev-dependencies]
random-string = { path = "../keel/random-string" }
