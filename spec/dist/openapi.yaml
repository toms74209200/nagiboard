openapi: 3.1.0
info:
  title: nagiboard
  version: 0.1.0
  description: Real-time collaboration API for the event storming board.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security: []
tags:
  - name: room
    description: Creating and joining rooms
  - name: board
    description: Reading boards
  - name: deck
    description: Opening the board app
paths:
  /:
    get:
      tags:
        - deck
      operationId: getDeck
      summary: Open the board app
      description: |
        Returns the page of the board app. A share link of a room opens this page with
        the room ID, and the app reads the boards of the room.
      parameters:
        - name: room
          in: query
          required: false
          description: The room ID of a share link
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The page of the board app
          content:
            text/html:
              schema:
                type: string
  /assets/{name}:
    get:
      tags:
        - deck
      operationId: getDeckAsset
      summary: Get a script of the board app
      parameters:
        - name: name
          in: path
          required: true
          description: The file name the page refers to
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+\.js$
      responses:
        '200':
          description: The script
          content:
            text/javascript:
              schema:
                type: string
        '404':
          description: The app has no script of the name
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
  /rooms:
    post:
      tags:
        - room
      operationId: postRooms
      summary: Create a room
      description: |
        Creates a room so that other people and AI agents can edit the board together,
        and returns its ID. Knowing the ID is what lets a participant join.

        - A solid connection that the connection rules don't allow is kept as dashed.
        - Rejected with 400 if the data cannot be decoded, its DSL exceeds 1 MiB, or any
          line cannot be expressed on a board.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: string
                  pattern: ^[A-Za-z0-9_-]*$
                  maxLength: 16384
                  description: The board as in the `data` parameter of a board URL (raw DEFLATE, then base64url without padding)
            example:
              data: HYxLCoQwEAX3fYqHbnWRVsSVCHOA8Qoh9oiQD2Sic_3p-BZvU0W1kFti-ZaUwxkP3IbKWbzgnXfJ-Pj0I7JOMeqs0Wtel_pBcoMV49zxwORSCDbuSt2jbN46QaqRarGZOuZRUwb9og79AQ
      responses:
        '201':
          description: The room was created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - shareUrl
                properties:
                  id:
                    type: string
                    format: uuid
                    description: A random (version 4) UUID
                  shareUrl:
                    type: string
                    format: uri-reference
                    description: |
                      The link that opens the board of the room in the app. It is relative to
                      this server, so it is resolved against the URL the request was sent to.
              example:
                id: 6f1c2b7e-3a4d-4e8f-9b0a-1c2d3e4f5a6b
                shareUrl: /?room=6f1c2b7e-3a4d-4e8f-9b0a-1c2d3e4f5a6b
        '400':
          description: The data cannot be decoded, or its DSL has lines that cannot be expressed on a board
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                    format: uri-reference
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  diagnostics:
                    type: array
                    description: Present when the DSL was decoded but has lines that cannot be expressed
                    items:
                      type: object
                      required:
                        - line
                        - message
                      properties:
                        line:
                          type: integer
                          minimum: 1
                        message:
                          type: string
              example:
                type: about:blank
                title: Bad Request
                status: 400
                diagnostics:
                  - line: 4
                    message: '4行目: 未知の付箋タイプ "sticky"'
  /rooms/{id}/boards:
    get:
      tags:
        - room
      operationId: getRoomBoards
      summary: List the boards of a room
      description: |
        Returns the IDs of the boards associated with the room. Each board is read by its ID
        from `/boards/{id}`, so that everyone who knows the room ID sees the same boards.
      parameters:
        - name: id
          in: path
          required: true
          description: The room ID returned when the room was created
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The IDs of the boards associated with the room
          content:
            application/json:
              schema:
                type: object
                required:
                  - boards
                properties:
                  boards:
                    type: array
                    items:
                      type: string
                      format: uuid
              example:
                boards:
                  - 0b7c9e2d-5f14-4a3b-8c6d-2e9f1a4b7c3e
        '404':
          description: No room has the ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
  /rooms/{id}/ops:
    post:
      tags:
        - room
      operationId: postRoomOps
      summary: Apply operations to the board of a room
      description: |
        Applies a batch of operations to the board of the room, in order and all at once,
        and gives the batch the next sequence number of the board.

        - For each property of a note, the last write wins. The server decides which write
          is last by the order in which it applies batches.
        - A proposed note ID that is already taken is reassigned to the next free ID of
          its note type, and the result of the operation says so.
        - An operation that is not possible on the board is skipped, and the result of the
          operation says so. If no operation is possible, the batch gets no sequence number.
      parameters:
        - name: id
          in: path
          required: true
          description: The room ID returned when the room was created
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ops
              properties:
                ops:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    description: An operation on the board of the room, distinguished by `type`
                    oneOf:
                      - title: AddNote
                        type: object
                        description: |
                          Adds a note. `id` is proposed by the client; if a note already has
                          it, the server assigns the next free ID of the note type instead.
                        required:
                          - type
                          - noteType
                          - id
                          - text
                          - x
                          - 'y'
                        properties:
                          type:
                            type: string
                            pattern: ^addNote$
                          noteType:
                            type: string
                            pattern: ^(event|command|actor|aggregate|policy|readmodel|system|hotspot)$
                          id:
                            type: string
                            pattern: ^[A-Za-z_][A-Za-z0-9_-]*$
                          text:
                            type: string
                          x:
                            type: number
                          'y':
                            type: number
                      - title: MoveNotes
                        type: object
                        description: |
                          Sets the absolute positions of notes. The last write wins per note.
                          It is skipped if any of the notes does not exist.
                        required:
                          - type
                          - positions
                        properties:
                          type:
                            type: string
                            pattern: ^moveNotes$
                          positions:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              required:
                                - id
                                - x
                                - 'y'
                              properties:
                                id:
                                  type: string
                                  pattern: ^[A-Za-z_][A-Za-z0-9_-]*$
                                x:
                                  type: number
                                'y':
                                  type: number
            example:
              ops:
                - type: addNote
                  noteType: event
                  id: e1
                  text: Order placed
                  x: 384
                  'y': 224
                - type: moveNotes
                  positions:
                    - id: c1
                      x: 216
                      'y': 240
      responses:
        '200':
          description: The batch was applied
          content:
            application/json:
              schema:
                type: object
                required:
                  - seq
                  - results
                properties:
                  seq:
                    type: integer
                    minimum: 0
                    description: |
                      The sequence number of the board after the batch: the one given to the
                      batch, or the current one if no operation was possible. 0 means the board
                      has not been edited since it was created.
                  results:
                    type: array
                    description: The result of each operation, in the order of `ops`
                    items:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          pattern: ^(applied|reassigned|skipped)$
                        id:
                          type: string
                          description: The note ID the server assigned, present when `status` is `reassigned`
              example:
                seq: 3
                results:
                  - status: reassigned
                    id: e2
                  - status: applied
        '404':
          description: No room has the ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
  /boards/{id}:
    get:
      tags:
        - board
      operationId: getBoard
      summary: Get a board
      description: Returns the current content of the board as DSL.
      parameters:
        - name: id
          in: path
          required: true
          description: The board ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current content of the board
          content:
            text/plain:
              schema:
                type: string
              example: |
                # eventstorming v1
                title Order flow

                actor     a1   "Customer" @ 48,232
                command   c1   "Place order" @ 216,224

                a1 -> c1
        '404':
          description: No board has the ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
components:
  schemas:
    problem:
      type: object
      description: A problem detail (RFC 9457)
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
