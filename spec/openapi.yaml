openapi: 3.1.0
info:
  title: nagiboard
  version: 0.1.0
  description: Real-time collaboration API for the event storming board.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security: []
tags:
  - name: room
    description: Creating and joining rooms
  - name: board
    description: Reading boards

paths:
  /rooms:
    $ref: ./room/rooms.yaml#/~1rooms
  /rooms/{id}/boards:
    $ref: ./room/rooms.yaml#/~1rooms~1{id}~1boards
  /boards/{id}:
    $ref: ./board/boards.yaml#/~1boards~1{id}
